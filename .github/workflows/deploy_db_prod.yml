name: Deploy DB Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-migrations:
    runs-on: self-hosted

    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: yoyo-deploy
        uses: ./.github/actions/yoyo_deploy
        with:
          database: ${{ vars.DATABASE }}
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
